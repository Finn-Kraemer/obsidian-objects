name: Bump Version

# Started manually from the GitHub UI (Actions > Bump Version > Run workflow).
# Does the same as `npm run release:<bump>` locally, then builds the release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release

jobs:
  bump:
    # Only release from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Runs preversion (build + lint) and the version script, then commits and tags
      - name: Bump version
        id: bump
        run: |
          npm version ${{ inputs.bump }}
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push origin HEAD:main "refs/tags/${{ steps.bump.outputs.version }}"

  # A tag pushed with GITHUB_TOKEN does not trigger other workflows,
  # so the release workflow is called directly.
  release:
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.version }}
